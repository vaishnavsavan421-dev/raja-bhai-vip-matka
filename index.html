        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px 30px;
            border-radius: 20px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }
        
        .games {
            font-size: 1.2rem;
            line-height: 2;
            margin-bottom: 25px;
            color: #e0e0e0;
        }
        
        .tagline {
            font-size: 1.5rem;
            color: #ff6b6b;
            font-weight: bold;
            margin: 25px 0;
        }
        
        .features {
            font-size: 1.1rem;
            margin: 20px 0;
            color: #4ecdc4;
        }
        
        .cta {
            font-size: 1.3rem;
            color: #ffd700;
            margin-top: 25px;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            transition: transform 0.3s;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .games { font-size: 1rem; }
            .tagline { font-size: 1.2rem; }
        }
    </style>
